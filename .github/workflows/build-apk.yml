name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository root"
            ls -la
            exit 1
          fi
          mkdir -p unpacked
          unzip -q "$ZIP_FILE" -d unpacked
          PROJECT_DIR=$(dirname "$(find unpacked -name settings.gradle.kts -print -quit)")
          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR/app" ]; then
            echo "Android project structure not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        id: build
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug
          APK_PATH=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name '*.apk' -print -quit)
          if [ -z "$APK_PATH" ]; then
            echo "APK not generated"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: LetsEarnFromRunning-APK
          path: ${{ steps.build.outputs.apk_path }}
