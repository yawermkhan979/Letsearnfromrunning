name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o LetsEarnFromRunning_Android_Project.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p LetsEarnFromRunning assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LetsEarnFromRunning-APK
          path: LetsEarnFromRunning/app/build/outputs/apk/debug/app-debug.apk
